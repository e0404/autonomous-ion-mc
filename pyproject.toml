[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ionmc"
version = "0.1.0.dev0"
description = "Research-grade ion-therapy Monte Carlo (Python-first, NVIDIA Warp accelerated)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "numpy>=1.26",
    "warp-lang>=1.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ionmc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "warp: requires warp-lang",
    "cuda: requires a CUDA device",
    "network: requires network access",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
# Defaults (double quotes) are intentional; no overrides needed.

[tool.mypy]
python_version = "3.12"
files = ["src/ionmc"]
strict = false
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "warp.*"
ignore_missing_imports = true
