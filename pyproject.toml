[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ionmc"
version = "0.1.0.dev0"
description = "Ion-therapy Monte Carlo transport with a Python reference path and NVIDIA Warp CPU/CUDA acceleration"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "numpy>=2.0",
    "warp-lang>=1.17,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.12",
    "mypy>=1.17",
]

[project.scripts]
ionmc = "ionmc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ionmc"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/ionmc", "hatch_build.py", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "local: local scientific validation; excluded from lightweight GitHub CI",
    "cuda: requires a CUDA device through the controlled host runner",
]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
# Scientific docstrings and comments use Greek letters, minus signs and
# superscripts deliberately; the ambiguous-unicode checks would forbid them.
# E501 is left to the formatter (88 columns for code); long docstrings, f-strings
# and comment lines with formulas/URLs are allowed.
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# MATH is injected by ionmc.transport.shared before the module body runs, and
# Warp's floor() returns a float (unlike math.floor), so int() casts are needed.
# UP018/RUF046: Warp needs int(0)/float(0.0) calls to declare dynamic loop variables.
"src/ionmc/transport/step_physics.py" = ["F821", "RUF046", "UP018"]
"src/ionmc/transport/warp_backend.py" = ["RUF046", "UP018"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Warp kernels use wp.array(dtype=...) call expressions as annotations, which
# mypy cannot interpret; the kernel signature is checked by Warp at build time.
module = ["ionmc.transport.warp_backend", "ionmc.transport.step_physics"]
disable_error_code = ["valid-type"]
