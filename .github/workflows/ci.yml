name: CI

on:
  pull_request:
    branches:
      - develop
      - main
      - "v3/develop"
      - "v3/main"
  push:
    branches:
      - develop
      - main
      - "v3/develop"
      - "v3/main"

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.11"
          enable-cache: true

      - name: Run pre-commit
        run: uvx --from pre-commit==4.6.2 pre-commit run --all-files

  tests:
    name: tests
    runs-on: ubuntu-latest
    # 30 minutes: the lightweight suite takes 12-18 minutes on the hosted runner (20 minutes was hit
    # on 2026-11-17, run 44060676734, job cancelled by this limit, not by a test failure).
    timeout-minutes: 30
    env:
      # The sealed diagnostics of V3-008 amendment I3-FU-1 require the running interpreter's
      # major.minor to equal the lower bound of uv.lock's requires-python (3.12); without a pin
      # uv selects the newest interpreter (3.14 on 2026-11-16) and those tests fail.
      UV_PYTHON: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.11"
          enable-cache: true

      - name: Install locked environment
        run: uv sync --extra dev --locked

      - name: Run lightweight tests
        run: uv run pytest tests -q -m "not cuda and not host"

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.11"
          enable-cache: true

      - name: Generate documentation sources
        run: python3 infrastructure/docs/generate_docs.py

      - name: Build documentation
        run: uvx zensical build --clean --strict
