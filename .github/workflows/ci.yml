name: CI

on:
  pull_request:
    branches:
      - develop
      - main
      - "v2/develop"
      - "v2/main"
  push:
    branches:
      - develop
      - main
      - "v2/develop"
      - "v2/main"

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.11"
          enable-cache: true

      - name: Run pre-commit
        run: uvx --from pre-commit==4.6.2 pre-commit run --all-files

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.11"
          enable-cache: true

      - name: Install locked project environment
        run: uv sync --locked --extra dev

      - name: Run lightweight tests
        run: uv run --frozen python -m pytest tests -q -m "not local and not cuda"

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.11"
          enable-cache: true

      - name: Generate documentation sources
        run: python3 infrastructure/docs/generate_docs.py

      - name: Build documentation
        run: uvx zensical build --clean --strict
